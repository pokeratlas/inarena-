name: backend-ci

on:
  push:
    branches: ["main", "release/closed-beta-rc1"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Build production container
        run: docker build -t inarena-backend-ci .


  postgres-integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: inarena
          POSTGRES_PASSWORD: inarena
          POSTGRES_DB: inarena_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inarena -d inarena_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        working-directory: backend

    env:
      INARENA_TEST_POSTGRES_URL: postgresql://inarena:inarena@localhost:5432/inarena_test
      INARENA_DATABASE_URL: postgresql://inarena:inarena@localhost:5432/inarena_test
      INARENA_ENV: test
      INARENA_OPERATOR_KEY: operator

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,postgres]"
      - run: pytest -q tests/test_postgres_integration.py


  redis-integration:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        working-directory: backend

    env:
      INARENA_TEST_REDIS_URL: redis://localhost:6379/0
      INARENA_REDIS_URL: redis://localhost:6379/0
      INARENA_ENV: test

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,production]"
      - run: pytest -q tests/test_redis_coordination.py


  staging-smoke:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: inarena
          POSTGRES_PASSWORD: inarena
          POSTGRES_DB: inarena_staging
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inarena -d inarena_staging"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        working-directory: backend

    env:
      INARENA_DATABASE_URL: postgresql://inarena:inarena@localhost:5432/inarena_staging
      INARENA_REDIS_URL: redis://localhost:6379/0
      INARENA_ENV: staging
      INARENA_OPERATOR_KEY: staging-operator
      INARENA_ALLOWED_ORIGINS: http://staging.local
      INARENA_SMOKE_ORIGIN: http://staging.local
      INARENA_DB_POOL_MIN: 1
      INARENA_DB_POOL_MAX: 4

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,production]"
      - name: Run migrations
        run: python -m app.migrate upgrade
      - name: Verify migration status
        run: python -m app.migrate check
      - name: Start staging backend
        run: |
          sh entrypoint.sh > /tmp/inarena-staging.log 2>&1 &
          echo $! > /tmp/inarena-staging.pid
      - name: Wait for readiness
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/inarena-staging.log
          exit 1
      - name: Run staging smoke test
        run: python scripts/staging_smoke.py --operator-key staging-operator
      - name: Show backend log on failure
        if: failure()
        run: cat /tmp/inarena-staging.log || true


  load-smoke:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: inarena
          POSTGRES_PASSWORD: inarena
          POSTGRES_DB: inarena_load
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inarena -d inarena_load"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        working-directory: backend

    env:
      INARENA_DATABASE_URL: postgresql://inarena:inarena@localhost:5432/inarena_load
      INARENA_REDIS_URL: redis://localhost:6379/0
      INARENA_ENV: staging
      INARENA_OPERATOR_KEY: load-operator
      INARENA_ALLOWED_ORIGINS: http://staging.local
      INARENA_RATE_LIMIT_WS_PER_MINUTE: 200
      INARENA_DB_POOL_MIN: 1
      INARENA_DB_POOL_MAX: 8

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[production]"
      - name: Start backend
        run: |
          sh entrypoint.sh > /tmp/inarena-load.log 2>&1 &
          echo $! > /tmp/inarena-load.pid
      - name: Wait for readiness
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/inarena-load.log
          exit 1
      - name: Create scoped operator session and load-test table
        run: |
          TOKEN=$(curl -fsS             -H 'Content-Type: application/json'             -H 'X-Operator-Key: load-operator'             -d '{"scopes":[]}'             http://127.0.0.1:8000/api/v1/operator/auth             | python -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          TABLE_ID=$(curl -fsS             -H 'Content-Type: application/json'             -H "X-Operator-Key: $TOKEN"             -d '{"name":"Load Test"}'             http://127.0.0.1:8000/api/v1/operator/tables             | python -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          echo "TABLE_ID=$TABLE_ID" >> "$GITHUB_ENV"
      - name: Run k6 load baseline
        working-directory: .
        run: |
          docker run --rm --network host             -e BASE_URL=http://127.0.0.1:8000             -e WS_BASE_URL=ws://127.0.0.1:8000             -e TABLE_ID="$TABLE_ID"             -e ORIGIN=http://staging.local             -v "$GITHUB_WORKSPACE:/work"             grafana/k6:latest run /work/load/inarena.js
      - name: Show backend log on failure
        if: failure()
        run: cat /tmp/inarena-load.log || true


  backup-restore-drill:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: inarena
          POSTGRES_PASSWORD: inarena
          POSTGRES_DB: inarena_backup
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inarena -d inarena_backup"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        working-directory: backend

    env:
      INARENA_DATABASE_URL: postgresql://inarena:inarena@localhost:5432/inarena_backup
      INARENA_ENV: test
      INARENA_OPERATOR_KEY: backup-operator
      PGPASSWORD: inarena

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[production]"

      - name: Migrate source database
        run: python -m app.migrate upgrade

      - name: Seed meaningful INARENA state
        run: python scripts/backup_restore_fixture.py seed

      - name: Create and validate backup
        run: |
          pg_dump             --format=custom             --no-owner             --no-acl             "$INARENA_DATABASE_URL"             > /tmp/inarena-backup.dump
          pg_restore --list /tmp/inarena-backup.dump > /dev/null
          sha256sum /tmp/inarena-backup.dump

      - name: Create clean restore database
        run: |
          psql             "postgresql://inarena:inarena@localhost:5432/postgres"             -v ON_ERROR_STOP=1             -c "DROP DATABASE IF EXISTS inarena_restore;"
          psql             "postgresql://inarena:inarena@localhost:5432/postgres"             -v ON_ERROR_STOP=1             -c "CREATE DATABASE inarena_restore;"

      - name: Restore backup
        run: |
          pg_restore             --no-owner             --no-acl             --dbname="postgresql://inarena:inarena@localhost:5432/inarena_restore"             /tmp/inarena-backup.dump

      - name: Verify restored schema and data
        env:
          INARENA_DATABASE_URL: postgresql://inarena:inarena@localhost:5432/inarena_restore
        run: |
          python -m app.migrate check
          python scripts/backup_restore_fixture.py verify
