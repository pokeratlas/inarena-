name: backend-ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Build production container
        run: docker build -t inarena-backend-ci .


  postgres-integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: inarena
          POSTGRES_PASSWORD: inarena
          POSTGRES_DB: inarena_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inarena -d inarena_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        working-directory: backend

    env:
      INARENA_TEST_POSTGRES_URL: postgresql://inarena:inarena@localhost:5432/inarena_test
      INARENA_DATABASE_URL: postgresql://inarena:inarena@localhost:5432/inarena_test
      INARENA_ENV: test
      INARENA_OPERATOR_KEY: operator

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,postgres]"
      - run: pytest -q tests/test_postgres_integration.py


  redis-integration:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        working-directory: backend

    env:
      INARENA_TEST_REDIS_URL: redis://localhost:6379/0
      INARENA_REDIS_URL: redis://localhost:6379/0
      INARENA_ENV: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,production]"
      - run: pytest -q tests/test_redis_coordination.py
