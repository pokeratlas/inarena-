services:
  - type: web
    name: inarena-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: INARENA_ENV
        value: staging
      - key: INARENA_DATABASE_URL
        fromDatabase:
          name: inarena-postgres
          property: connectionString
      - key: INARENA_REDIS_URL
        fromService:
          type: keyvalue
          name: inarena-redis
          property: connectionString
      - key: INARENA_OPERATOR_KEY
        sync: false
      - key: INARENA_ALLOWED_ORIGINS
        fromService:
          type: web
          name: inarena-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: INARENA_RELEASE
        fromService:
          type: web
          name: inarena-backend
          envVarKey: RENDER_GIT_COMMIT
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: INARENA_DB_POOL_MIN
        value: "2"
      - key: INARENA_DB_POOL_MAX
        value: "10"
      - key: INARENA_DB_POOL_TIMEOUT_SECONDS
        value: "5"

  - type: web
    name: inarena-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: false
    envVars:
      - key: VITE_API_BASE
        fromService:
          type: web
          name: inarena-backend
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

  - type: keyvalue
    name: inarena-redis
    ipAllowList: []

databases:
  - name: inarena-postgres
    databaseName: inarena
    user: inarena
