services:
  - type: web
    name: inarena-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: INARENA_ENV
        value: staging
      - key: INARENA_DATABASE_URL
        fromDatabase:
          name: inarena-postgres
          property: connectionString
      - key: INARENA_REDIS_URL
        fromService:
          type: keyvalue
          name: inarena-redis
          property: connectionString
      - key: INARENA_OPERATOR_KEY
        sync: false
      - key: INARENA_ALLOWED_ORIGINS
        sync: false
      - key: INARENA_RELEASE
        value: render-staging
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: INARENA_DB_POOL_MIN
        value: "2"
      - key: INARENA_DB_POOL_MAX
        value: "10"
      - key: INARENA_DB_POOL_TIMEOUT_SECONDS
        value: "5"

  - type: keyvalue
    name: inarena-redis
    ipAllowList: []

databases:
  - name: inarena-postgres
    databaseName: inarena
    user: inarena
